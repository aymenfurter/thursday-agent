[package]
name = "thursday-agent"
version = "0.1.0"
edition = "2024"
authors = ["Aymen Furter"]
description = "A GUI-less, voice-driven Copilot for macOS (GPT-Live 1 + GitHub Copilot SDK + computer use)"
license = "MIT"

[[bin]]
name = "thursday-agent"
path = "src/main.rs"

[dependencies]
github-copilot-sdk = { version = "1.0.14", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
async-trait = "0.1"
indexmap = { version = "2", features = ["serde"] }
base64 = "0.22"
cpal = "0.18"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rpassword = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
parking_lot = "0.12"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
libc = "0.2"


[profile.release]
opt-level = 3
lto = "thin"
